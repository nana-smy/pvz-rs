<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>植物大战僵尸 · Rust 重制版</title>
<meta name="description" content="用 Rust + WebAssembly 重写的植物大战僵尸，使用正版植物立绘与音效素材，可直接在浏览器游玩。" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 18%, #243d17 0%, #10200b 52%, #060d04 100%);
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #frame {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 26px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(160, 210, 120, .18);
    background: #4f8c2c;
  }
  canvas#game {
    display: block;
    width: 100%; height: 100%;
    outline: none; cursor: default;
    image-rendering: auto;
  }
  #loader {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    background: radial-gradient(circle at 50% 30%, #1e3313 0%, #0a1406 75%);
    transition: opacity .45s ease;
    z-index: 20;
  }
  #loader .sun {
    width: 54px; height: 54px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #fff7c4 0%, #ffdf6b 42%, #ffcc33 68%, #f2a41f 100%);
    box-shadow: 0 0 32px rgba(255, 205, 60, .55);
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(-4px) } 50% { transform: translateY(4px) } }
  #loader p { color: #cbe7a6; letter-spacing: .12em; font-size: 14px; margin: 0; }
  #loader small { color: #6f8d52; font-size: 12px; letter-spacing: .06em; }
  body.ready #loader { opacity: 0; pointer-events: none; }
  #err {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: #ffb4a2; font-size: 12px; background: rgba(40, 12, 8, .8);
    padding: 8px 14px; border-radius: 8px; display: none; max-width: 90vw;
    z-index: 30;
  }
  @media (max-width: 640px) {
    #frame { border-radius: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
</div>

<div id="loader">
  <div class="sun"></div>
  <p>正在加载原版素材（首次约 3–10 秒）…</p>
  <small>Rust + WebAssembly</small>
</div>
<div id="err"></div>

  const SFX_SRC = {
    click: './assets/audio/buttonclick.wav',
    sun: './assets/audio/points.wav',
    points: './assets/audio/points.wav',
    plant: './assets/audio/plant.wav',
    pause: './assets/audio/pause.wav',
    wave: './assets/audio/hugewave.wav',
    win: './assets/audio/finalfanfare.wav',
    lose: './assets/audio/losemusic.wav',
    shoot: './assets/audio/firepea.wav',
    ice_shoot: './assets/audio/snow_pea_sparkles.wav',
    explode: './assets/audio/cherrybomb.wav',
    groan: './assets/audio/groan.wav',
    mower: './assets/audio/lawnmower.wav',
    bite: './assets/audio/chomp.wav',
  };
  window.__pvzAssets = {};
  const sfxCache = {};
  window.__pvzSfx = (name) => {
    const src = SFX_SRC[name];
    if (!src) return false;
    try {
      let a = sfxCache[name];
      if (!a) {
        a = new Audio(src);
        a.preload = 'auto';
        sfxCache[name] = a;
      }
      a.currentTime = 0;
      a.play().catch(() => {});
      return true;
    } catch (e) {
      return false;
    }
  };
  let bgm = null;
  window.__pvzMusic = (on) => {
    try {
      if (!bgm) {
        bgm = new Audio('./assets/audio/music.mp3');
        bgm.loop = true;
        bgm.volume = 0.3;
      }
      if (on) bgm.play().catch(() => {});
      else bgm.pause();
      return true;
    } catch (e) {
      return false;
    }
  };
  const loadingText = document.querySelector('#loader p');
  const loadOne = (key, src) =>
    new Promise((resolve) => {
      const img = new Image();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve();
      };
      const timer = setTimeout(finish, 30000);
      img.onload = () => {
        window.__pvzAssets[key] = img;
        finish();
      };
      img.onerror = finish;
      img.src = src.startsWith('data:') ? src : src + '?v=live701';
    });
  // 素材并行加载；最多等 2.5 秒就开始游戏，迟到图片由 Rust 侧按需拾取
  const allImages = Promise.all(Object.entries(IMG_SRC).map(([k, v]) => loadOne(k, v)));
  await Promise.race([allImages, new Promise((r) => setTimeout(r, 2500))]);

  function fit() {
    const pad = window.innerWidth > 900 ? 18 : 0;
    const s = Math.min((window.innerWidth - pad * 2) / 1280, (window.innerHeight - pad * 2) / 720);
    const w = Math.floor(1280 * s);
    const h = Math.floor(720 * s);
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();

  init().catch((e) => {
    console.error(e);
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = '启动失败：' + (e && e.message ? e.message : e);
  });
