<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#10200b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PvZ Rust" />
<title>植物大战僵尸 · Rust 重制版</title>
<meta name="description" content="用 Rust + WebAssembly 重写的植物大战僵尸，使用正版植物立绘与音效素材，可直接在浏览器游玩。" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
    background: radial-gradient(circle at 50% 18%, #243d17 0%, #10200b 52%, #060d04 100%);
    overflow: hidden; overscroll-behavior: none;
    font-family: 'Trebuchet MS', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #frame {
    position: relative;
    max-width: 100%; max-height: 100%;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 26px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(160, 210, 120, .18);
    background: #4f8c2c;
  }
  canvas#game {
    display: block;
    width: 100%; height: 100%;
    outline: none; cursor: default;
    image-rendering: auto;
  }
  #loader {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    background: radial-gradient(circle at 50% 30%, #1e3313 0%, #0a1406 75%);
    transition: opacity .45s ease;
    z-index: 28;
  }
  #loader .sun {
    width: 54px; height: 54px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #fff7c4 0%, #ffdf6b 42%, #ffcc33 68%, #f2a41f 100%);
    box-shadow: 0 0 32px rgba(255, 205, 60, .55);
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(-4px) } 50% { transform: translateY(4px) } }
  #loader p { color: #cbe7a6; letter-spacing: .12em; font-size: 14px; margin: 0; }
  #loader small { color: #6f8d52; font-size: 12px; letter-spacing: .06em; }
  body.ready #loader { opacity: 0; pointer-events: none; }
  #err {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: #ffb4a2; font-size: 12px; background: rgba(40, 12, 8, .8);
    padding: 8px 14px; border-radius: 8px; display: none; max-width: 90vw;
    z-index: 30;
  }
  @media (min-width: 900px) {
    #stage { padding: 18px; }
  }
  @media (max-width: 640px) {
    #frame { border-radius: 0; box-shadow: none; }
  }
  #rotate {
    position: fixed; inset: 0; z-index: 24; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    background: radial-gradient(circle at 50% 40%, #223817 0%, #081105 80%);
    color: #d9efb8; text-align: center; padding: 24px;
  }
  #rotate .phone {
    width: 54px; height: 92px; border: 3px solid #9fc46f; border-radius: 12px;
    position: relative; animation: turn 1.9s ease-in-out infinite;
    box-shadow: 0 0 24px rgba(160, 210, 110, .22);
  }
  #rotate .phone::after {
    content: ''; position: absolute; left: 50%; bottom: 7px; width: 16px; height: 3px;
    margin-left: -8px; border-radius: 2px; background: #9fc46f;
  }
  @keyframes turn { 0%, 18% { transform: rotate(0) } 55%, 100% { transform: rotate(-90deg) } }
  #rotate h2 { font-size: 20px; margin: 8px 0 0; letter-spacing: .08em; }
  #rotate p { font-size: 13px; color: #8fae72; margin: 0; line-height: 1.7; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
</div>

<div id="loader">
  <div class="sun"></div>
  <p>正在加载原版素材（首次约 3–10 秒）…</p>
  <small>Rust + WebAssembly</small>
</div>
<div id="rotate">
  <div class="phone"></div>
  <h2>请横屏游玩</h2>
  <p>把手机横过来，草坪会自动铺满屏幕</p>
</div>
<div id="err"></div>

      if (prefix) name = prefix + '/' + name;
      if (!name) break;
      const size = parseInt(readStr(h, 124, 136), 8) || 0;
      const type = String.fromCharCode(h[156] || 48);
      const dataOff = off + 512;
      if ((type === '0' || type === '\\0') && size > 0) {
        const blob = new Blob([buffer.slice(dataOff, dataOff + size)], { type: mimeOf(name) });
        out.set(name.replace(/^\.\//, ''), URL.createObjectURL(blob));
      }
      off = dataOff + Math.ceil(size / 512) * 512;
    }
    return out;
  }
  // 慢链路下"整体 20s 超时"会把正在正常下载的大包误杀，触发重试反而更慢。
  // 改成：只看"空闲超时"——15 秒没收到任何字节才判失败，并汇报实时进度。
  const readAll = async (resp, onProgress) => {
    const total = parseInt(resp.headers.get('content-length') || '0', 10);
    if (!resp.body) { const b = await resp.arrayBuffer(); onProgress && onProgress(b.byteLength, total); return new Uint8Array(b); }
    const reader = resp.body.getReader();
    const chunks = [];
    let got = 0;
    while (true) {
      let tid = 0;
      const idle = new Promise((_, rej) => { tid = setTimeout(() => rej(new Error('idle timeout')), 15000); });
      const step = await Promise.race([reader.read(), idle]);
      clearTimeout(tid);
      if (step.done) break;
      chunks.push(step.value);
      got += step.value.length;
      onProgress && onProgress(got, total);
    }
    const buf = new Uint8Array(got);
    let off = 0;
    for (const c of chunks) { buf.set(c, off); off += c.length; }
    return buf;
  };
  async function fetchAssetPack(packUrl = ASSET_PACK, onProgress = null) {
    let lastErr = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const r = await fetch(packUrl + '?v=__ASSET_VERSION__&r=' + attempt, { cache: 'force-cache' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const buf = await readAll(r, onProgress);
        // untar 以 ArrayBuffer 视图切块，这里交回底层 buffer
        const files = untar(buf.buffer);
        if (files.size < 5) throw new Error('素材包不完整: ' + files.size);
        return files;
      } catch (e) {
        lastErr = e;
        console.warn('[pvz] 素材包加载失败，重试', attempt + 1, e);
      }
    }
    throw lastErr;
  }
  const loadOne = (key, src) =>
    new Promise((resolve) => {
      let done = false;
      let attempt = 0;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve();
      };
      const timer = setTimeout(finish, 12000);
      const start = () => {
        attempt += 1;
        const img = new Image();
        // 植物与背景优先，僵尸帧只用于战斗阶段，避免占满并发连接让末位植物长时间空白
        img.fetchPriority = key.startsWith('z_') ? 'low' : 'high';
        img.onload = () => {
          window.__pvzAssets[key] = img;
          finish();
        };
        img.onerror = () => {
          // GitHub Pages 的 HTTP/2 连接偶尔会丢图；同一素材重试一次再放弃。
          if (attempt < 2) setTimeout(start, 350);
          else finish();
        };
        const real = assetUrl(src);
        img.src = (real.startsWith('data:') || real.startsWith('blob:')) ? real : real + '?v=__ASSET_VERSION__&r=' + attempt;
      };
      start();
    });
  try {
    const packed = await fetchAssetPack();
    packed.forEach((u, k) => packUrls.set(k, u));
  } catch (e) {
    loadingText.textContent = '素材包加载失败，回退逐个加载…';
    console.error('[pvz] 单包失败，回退散资源', e);
  }
  // 限制并发，避免 GitHub Pages 的 HTTP/2 连接被上百张图同时打满。
  const jobs = [];
  let active = 0;
  const pump = () => {
    while (active < 4 && jobs.length) {
      const job = jobs.shift();
      active += 1;
      job.run().finally(() => { active -= 1; pump(); });
    }
  };
  const enqueue = (key, src) => new Promise((resolve) => {
    jobs.push({ run: () => loadOne(key, src).then(resolve) });
    pump();
  });
  // 首屏只等主菜单需要的几张图；49 张卡面与地图背景随后由核心包补齐。
  const UI_KEYS = new Set(['bg_day', 'sunflower', 'peashooter', 'wallnut', 'cherrybomb', 'snowpea', 'pea']);
  const coreImages = Promise.all(Object.entries(IMG_SRC)
    .filter(([k]) => UI_KEYS.has(k))
    .map(([k, v]) => enqueue(k, v)));
  await Promise.race([coreImages, new Promise((r) => setTimeout(r, 6000))]);
  // 音频与僵尸帧分两个包在后台加载，不阻塞主菜单与选卡。
  const packLater = async (url, min, after) => {
    try {
      const files = await fetchAssetPack(url);
      if (files.size < min) throw new Error('包不完整 ' + files.size);
      files.forEach((u, k) => packUrls.set(k, u));
      if (after) after(files);
    } catch (e) { console.warn('[pvz] 后台素材包失败', url, e); }
  };
  packLater('./assets-core.tar', 40, () => {
    Object.entries(IMG_SRC).filter(([k]) => !k.startsWith('z_') && !k.startsWith('r_') && !UI_KEYS.has(k)).forEach(([k, v]) => enqueue(k, v));
  });
  packLater('./assets-audio.tar', 10, () => {
    for (const k of Object.keys(SFX_SRC)) {
      const p = SFX_SRC[k].replace(/^\.\//, '');
      if (packUrls.has(p)) SFX_SRC[k] = packUrls.get(p);
    }
    if (typeof bgm !== 'undefined') {
      const m = packUrls.get('audio/music.mp3');
      if (m && bgm) bgm.src = m;
    }
  });
  // reanim 图集按植物/僵尸分组：植物包必须首屏就绪（选卡与战斗都要用），
  // 僵尸包在后台并行拉，进入战斗前 18 秒空档足够补完，避免首屏被 8MB 僵尸海拖住。
  const REANIM_PLANT_URLS = ['./assets-reanim-p0-__ASSET_VERSION__.tar', './assets-reanim-p1-__ASSET_VERSION__.tar', './assets-reanim-p2-__ASSET_VERSION__.tar'];
  // 僵尸分两档：walk 第一波就要，其余动作（eat/die/special）可以更晚到
  const REANIM_ZWALK_URLS = ['./assets-reanim-zw0-__ASSET_VERSION__.tar', './assets-reanim-zw1-__ASSET_VERSION__.tar'];
  const REANIM_ZX_URLS = ['./assets-reanim-zo0-__ASSET_VERSION__.tar', './assets-reanim-zo1-__ASSET_VERSION__.tar', './assets-reanim-zo2-__ASSET_VERSION__.tar', './assets-reanim-zo3-__ASSET_VERSION__.tar', './assets-reanim-zo4-__ASSET_VERSION__.tar'];
  const reanimGroup = window.__REANIM_GROUP || {};
  const packReanimGroup = async (urls, kind, conc = 99, onProgress = null) => {
    const got = new Map();
    const bump = (url) => (n) => {
      got.set(url, n);
      if (onProgress) onProgress([...got.values()].reduce((a, b) => a + b, 0));
    };
    const one = (url) => fetchAssetPack(url, onProgress ? bump(url) : null).catch(e => {
      console.warn('[pvz] reanim 分包失败', url, e);
      return null;
    });
    const results = [];
    for (let i = 0; i < urls.length; i += conc) {
      results.push(...await Promise.all(urls.slice(i, i + conc).map(one)));
    }
    let added = 0;
    for (const files of results) {
      if (!files) continue;
      files.forEach((u, k) => { packUrls.set(k, u); added += 1; });
    }
    // 每组只覆盖一部分 clip（植物 / 僵尸 walk / 僵尸其它），所以不按全局数量校验，
    // 只在该组整包全丢时告警。
    const keys = Object.entries(IMG_SRC)
      .filter(([k]) => k.startsWith('r_') && (kind ? reanimGroup[k] === kind : true));
    if (added === 0) console.warn('[pvz] reanim 分包整组失败', kind, urls[0]);
    return keys;
  };
  // 植物：下载 + 解码都完成后才放行首屏
  const PLANT_MB = 3.6;
  const plantProg = (got) => {
    loadingText.textContent = '正在加载植物素材 ' + Math.min(PLANT_MB, got / 1048576).toFixed(1) + ' / ' + PLANT_MB + ' MB…';
  };
  const plantKeys = await packReanimGroup(REANIM_PLANT_URLS, 'plant', 99, plantProg);
  // 兜底：极端慢网（包下不动、散图逐张超时）不能把首屏锁死在一分多钟，
  // 45 秒到点就放行；已排队的图会在进入游戏后继续补，图标/贴图随之出现。
  const decodeAll = Promise.all(plantKeys.map(([k, v]) => enqueue(k, v)));
  await Promise.race([decodeAll, new Promise((r) => setTimeout(r, 45000))]);
  // 僵尸：等植物包落地后再启动（错开并发，别和首屏抢带宽）。先 walk，再补其余动作。
  const packZombie = async () => {
    for (const urls of [REANIM_ZWALK_URLS, REANIM_ZX_URLS]) {
      const keys = await packReanimGroup(urls, 'zombie', 2).catch(() => []);
      await Promise.all(keys.map(([k, v]) => enqueue(k, v)));
    }
  };
  // 首屏真正可交互（body.ready）之后才开始拉僵尸，彻底让出首屏带宽
  const afterReady = () => setTimeout(packZombie, 400);
  if (document.body.classList.contains('ready')) afterReady();
  else new MutationObserver((_, ob) => {
    if (document.body.classList.contains('ready')) { ob.disconnect(); afterReady(); }
  }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  packLater('./assets-zombies.tar', 100, () => {
    Object.entries(IMG_SRC).filter(([k]) => k.startsWith('z_')).forEach(([k, v]) => enqueue(k, v));
  });

  function fit() {
    const stage = document.getElementById('stage');
    const cs = getComputedStyle(stage);
    const availW = stage.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
    const availH = stage.clientHeight - parseFloat(cs.paddingTop || 0) - parseFloat(cs.paddingBottom || 0);
    const s = Math.max(0.1, Math.min(availW / 1280, availH / 720));
    const w = Math.floor(1280 * s);
    const h = Math.floor(720 * s);
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  fit();

  const bootJs = packUrls.get('boot/pvz_rs.js');
  const bootWasm = packUrls.get('boot/pvz_rs_bg.wasm');
  let mod;
  try {
    if (bootJs && bootWasm) {
      mod = await import(bootJs);
      const wasmBytes = await (await fetch(bootWasm)).arrayBuffer();
      await mod.default(wasmBytes);
    } else {
      mod = await import('./pvz_rs.js');
      await mod.default();
    }
  } catch (e) {
    console.error(e);
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = '启动失败：' + (e && e.message ? e.message : e);
  }
</script>
</body>
</html>
